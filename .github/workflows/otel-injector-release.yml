# Releases the ADOT build of the OpenTelemetry Injector (tools/otel-injector) on its own, independent of the Python
# SDK release. Run it manually when the Injector changed; the SDK repositories (Python, Java, Node.js, .NET) pin a
# release and pick up new ones through their own weekly bump workflows.
# Tag: aws-otel-injector-v<upstream version from UPSTREAM>[-<suffix>]; the suffix counts releases with changed ADOT
# patches on the same upstream version (none for the first one).
name: OTel Injector Release
on:
  workflow_dispatch:
    inputs:
      suffix:
        description: Empty for the first release on the upstream version in UPSTREAM; 1, 2, ... for later releases with changed patches
        required: false
        default: ""

env:
  SUFFIX: ${{ github.event.inputs.suffix }}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    environment: Release
    runs-on: ubuntu-latest # TEMPORARY for fork validation only
    env:
      INJECTOR_DIR: ${{ github.workspace }}/otel-injector-out
    steps:
      - name: Checkout Repo @ SHA - ${{ github.sha }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: Set up CodeBuild runner
        uses: ./.github/actions/codebuild-runner-setup

      - name: Determine the release tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_TAG=$(sed -n 's/^UPSTREAM_TAG=//p' tools/otel-injector/UPSTREAM)
          if ! [[ "$UPSTREAM_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unexpected UPSTREAM_TAG '$UPSTREAM_TAG' in tools/otel-injector/UPSTREAM"
            exit 1
          fi
          if [ -n "$SUFFIX" ] && ! [[ "$SUFFIX" =~ ^[1-9][0-9]*$ ]]; then
            echo "suffix must be empty or a positive integer, got '$SUFFIX'"
            exit 1
          fi
          TAG="aws-otel-injector-$UPSTREAM_TAG${SUFFIX:+-$SUFFIX}"
          if gh release view "$TAG" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists; use the next suffix."
            exit 1
          fi
          echo "Releasing $TAG"
          {
            echo "TAG=$TAG"
            echo "UPSTREAM_TAG=$UPSTREAM_TAG"
          } >> "$GITHUB_ENV"

      # Downloads and verifies upstream and Zig, applies the ADOT patches, runs `zig fmt --check` and the upstream
      # unit tests (including the start-up guard's), and builds x86_64 and aarch64.
      - name: Build OTel Injector
        run: tools/otel-injector/build.sh "$INJECTOR_DIR"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 #v4.2.2
        with:
          subject-path: |
            ${{ env.INJECTOR_DIR }}/libotelinject_amd64.so
            ${{ env.INJECTOR_DIR }}/libotelinject_arm64.so

      - name: Upload OTel Injector artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: ${{ env.TAG }}
          path: ${{ env.INJECTOR_DIR }}
          if-no-files-found: error

      # A tag separate from the SDK's v<version>; --latest=false keeps the SDK release as the repository's latest.
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release_notes.md << EOF
          ADOT build of the OpenTelemetry Injector: upstream $UPSTREAM_TAG plus the patches in tools/otel-injector.
          The ADOT auto-instrumentation images copy these files in; see tools/otel-injector/README.md.

          SHA256SUMS:
          \`\`\`
          $(cat "$INJECTOR_DIR/SHA256SUMS")
          \`\`\`
          EOF
          gh release create "$TAG" \
            "$INJECTOR_DIR/libotelinject_amd64.so" \
            "$INJECTOR_DIR/libotelinject_arm64.so" \
            "$INJECTOR_DIR/SHA256SUMS" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release_notes.md \
            --latest=false
